name: Build and deploy Airflow

on:
  push:
    branches: [main]
    paths:
      - "airflow/**"
      - "ingestion/**"
      - "dbt/**"

env:
  IMAGE: govcontractacr.azurecr.io/govcontract-airflow

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: govcontractacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Airflow image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: airflow/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Container Apps doesn't re-pull an unchanged :latest reference, so point the
      # app at this build's unique tag. Keeps min-replicas as is (scaled to 0).
      - name: Deploy image to Container App
        run: |
          az containerapp update \
            --name govcontract-airflow \
            --resource-group govcontract-rg \
            --image "$IMAGE:${{ github.sha }}" \
            --query "properties.provisioningState" -o tsv
