name: Build and deploy dashboard to Azure Container App

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "ingestion/snowflake_conn.py"
      - "ingestion/keyvault.py"
      - "ingestion/search_index.py"
      - "ingestion/scoring.py"
      - "ingestion/agent.py"
      - "requirements-streamlit.txt"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name govcontractacr

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dashboard/Dockerfile
          push: true
          tags: govcontractacr.azurecr.io/contractfit-dashboard:latest

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name contractfit-dashboard \
            --resource-group govcontract-rg \
            --image govcontractacr.azurecr.io/contractfit-dashboard:latest
