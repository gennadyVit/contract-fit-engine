name: Weekly Airflow DAG Trigger

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 6 AM UTC
  workflow_dispatch:      # allow manual trigger

env:
  APP_NAME: govcontract-airflow
  RESOURCE_GROUP: govcontract-rg
  AIRFLOW_URL: https://govcontract-airflow.blueocean-2d1872e6.eastus.azurecontainerapps.io
  DAG_ID: govcontract_daily_pipeline

jobs:
  trigger-dag:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Scale Airflow to 1 replica
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --min-replicas 1 \
            --max-replicas 1

      # Changing min-replicas creates a new revision. Airflow keeps its run history in
      # SQLite inside the container, so a run triggered on the old revision is lost when
      # Azure swaps it out. Wait until the new revision is the only active one.
      - name: Wait for the new revision to take over
        run: |
          for i in $(seq 1 30); do
            LATEST=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "properties.latestRevisionName" -o tsv)
            READY=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "properties.latestReadyRevisionName" -o tsv)
            OTHERS=$(az containerapp revision list --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "[?properties.active && name!='$LATEST'].name" -o tsv)
            echo "Attempt $i: latest=$LATEST ready=$READY other active=[${OTHERS}]"
            if [ "$LATEST" = "$READY" ] && [ -z "$OTHERS" ]; then
              echo "Revision $LATEST is the only active revision"
              exit 0
            fi
            sleep 20
          done
          echo "New revision did not take over within 10 minutes"
          exit 1

      - name: Wait for Airflow to be ready
        run: |
          echo "Waiting for Airflow webserver..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$AIRFLOW_URL/health")
            if [ "$STATUS" = "200" ]; then
              echo "Airflow is ready"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, waiting 20s..."
            sleep 20
          done
          echo "Airflow did not become healthy within 10 minutes"
          exit 1

      - name: Trigger DAG
        id: trigger
        env:
          AIRFLOW_PW: ${{ secrets.AIRFLOW_ADMIN_PASSWORD }}
        run: |
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            "$AIRFLOW_URL/api/v1/dags/$DAG_ID/dagRuns" \
            -H "Content-Type: application/json" \
            -u "admin:$AIRFLOW_PW" \
            -d '{"conf": {}}')
          CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP $CODE: $BODY"
          if [ "$CODE" != "200" ]; then
            echo "Trigger failed"
            exit 1
          fi
          RUN_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['dag_run_id'])")
          echo "Triggered run $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for DAG to complete
        env:
          AIRFLOW_PW: ${{ secrets.AIRFLOW_ADMIN_PASSWORD }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          ENCODED=$(python3 -c "import os,urllib.parse; print(urllib.parse.quote(os.environ['RUN_ID'], safe=''))")
          echo "Waiting for run $RUN_ID..."
          for i in $(seq 1 90); do
            RESPONSE=$(curl -sS -w "\n%{http_code}" \
              "$AIRFLOW_URL/api/v1/dags/$DAG_ID/dagRuns/$ENCODED" \
              -u "admin:$AIRFLOW_PW")
            CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            if [ "$CODE" = "404" ]; then
              echo "Run $RUN_ID no longer exists (container was replaced?)"
              exit 1
            fi
            if [ "$CODE" != "200" ]; then
              echo "Attempt $i: HTTP $CODE, retrying"
              sleep 60
              continue
            fi
            STATE=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['state'])")
            echo "Attempt $i: state=$STATE"
            if [ "$STATE" = "success" ]; then
              exit 0
            fi
            if [ "$STATE" = "failed" ]; then
              echo "DAG run failed"
              exit 1
            fi
            sleep 60
          done
          echo "DAG run did not finish within 90 minutes"
          exit 1

      - name: Scale Airflow back to 0
        if: always()
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --min-replicas 0 \
            --max-replicas 1
